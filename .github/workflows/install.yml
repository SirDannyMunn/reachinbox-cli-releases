name: Verify public installation
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .install --ignore-scripts --no-audit --no-fund https://github.com/SirDannyMunn/reachinbox-cli-releases/releases/download/v0.2.0/reachinbox-local-cli-0.2.0.tgz
      - run: npm exec --prefix .install -- reachinbox --help
      - run: npm exec --prefix .install -- reachinbox warmup fields
      - run: npm exec --prefix .install -- reachinbox auth status
